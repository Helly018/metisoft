<div class="min-h-screen bg-slate-50 text-slate-900 flex" *ngIf="showLayout(); else authRoute">
  <app-sidebar [activeTab]="activeTab()" (logout)="logout()"></app-sidebar>

  <div class="flex-1 flex flex-col min-h-screen overflow-y-auto">
    <app-header [title]="headerTitle()"></app-header>
    <main class="p-8 flex-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<ng-template #authRoute>
  <router-outlet></router-outlet>
</ng-template>
