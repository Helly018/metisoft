<div class="flex items-center justify-center min-h-screen bg-slate-50 text-slate-900 p-4 relative">
  <div class="w-full max-w-md p-8 bg-white border border-slate-200 rounded-lg shadow">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold tracking-tight text-slate-900 mb-2">Admin Portal</h2>
      <p class="text-sm text-slate-500">Sign in to access your dashboard</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="space-y-2">
        <label for="email" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="hellygoswami1810@gmail.com"
          class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600"
          [class.border-red-500]="loginForm.controls.email.invalid && loginForm.controls.email.touched"
        />
        <div class="text-red-650 text-xs mt-1" *ngIf="loginForm.controls.email.invalid && loginForm.controls.email.touched">
          <span *ngIf="loginForm.controls.email.errors?.['required']">Email is required</span>
          <span *ngIf="loginForm.controls.email.errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <div class="space-y-2">
        <label for="password" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600"
          [class.border-red-500]="loginForm.controls.password.invalid && loginForm.controls.password.touched"
        />
        <div class="text-red-650 text-xs mt-1" *ngIf="loginForm.controls.password.invalid && loginForm.controls.password.touched">
          <span *ngIf="loginForm.controls.password.errors?.['required']">Password is required</span>
          <span *ngIf="loginForm.controls.password.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading()" class="w-full flex items-center justify-center py-3 px-4 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-75 disabled:cursor-not-allowed text-sm font-semibold text-white rounded-lg transition-colors cursor-pointer">
        <span *ngIf="!isLoading()">Sign In</span>
        <span *ngIf="isLoading()" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
      </button>
    </form>

    <div class="mt-8 p-4 bg-slate-50 rounded-lg border border-slate-200 text-center text-xs text-slate-500">
      <p class="mb-1">Demo Credentials:</p>
      <code class="text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded mr-1">hellygoswami1810@gmail.com</code> / <code class="text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded ml-1">Helly@001</code>
    </div>
  </div>

  <div class="absolute top-6 right-6 flex items-center gap-3 p-4 bg-red-50 border border-red-200 text-red-800 rounded-lg shadow" *ngIf="errorMessage()">
    <span class="flex items-center justify-center w-5 h-5 bg-red-600 text-white font-bold text-[10px] rounded-full">✕</span>
    <span class="text-sm font-medium">{{ errorMessage() }}</span>
  </div>
</div>
